spring.application.name=goldencharm-api

# Configurações do Banco de Dados PostgreSQL
# Esta linha define a URL de conexão com o banco
spring.datasource.url=jdbc:postgresql://localhost:5432/golden_charm_db

# Usuário do banco de dados (padrão é postgres)
spring.datasource.username=postgres

# Senha que você criou na instalação do PostgreSQL
spring.datasource.password=postgres

# Driver JDBC do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
# Dialeto específico do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostra os comandos SQL no console (útil para aprender)
spring.jpa.show-sql=true

# Formata o SQL de forma legível
spring.jpa.properties.hibernate.format_sql=true

# Cria/atualiza as tabelas automaticamente
# update: atualiza as tabelas sem perder dados
# create: recria as tabelas toda vez (apaga dados)
spring.jpa.hibernate.ddl-auto=update

# Porta do servidor (padrão 8080)
server.port=8080